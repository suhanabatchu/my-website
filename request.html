<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes For U | Recipe Requests</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Recipes For U</h1>
        <p>Request a Recipe</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="recipes.html">Recipes</a></li>
            <li><a href="tips.html">Kitchen Tips</a></li>
            <li><a href="request.html" class="active">Recipe Requests</a></li>
        </ul>
    </nav>

    <main>

        <article class="form-box">

            <h2>🍽️ Request a Recipe</h2>

            <p>
                Looking for a recipe that isn't on our website?
                Fill in the form below and we'll consider adding it!
            </p>

            <form onsubmit="return validateForm()">

                <label for="name">Name:</label><br>
                <input type="text" id="name"><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email"><br><br>

<label for="category">Recipe Category:</label><br>

<select id="category">
    <option value="">Select a category</option>
    <option value="Breakfast">Breakfast</option>
    <option value="Lunch">Lunch</option>
    <option value="Dinner">Dinner</option>
    <option value="Dessert">Dessert</option>
    <option value="Snack">Snack</option>
    <option value="Vegetarian">Vegetarian</option>
</select>

<br><br>



                <label for="recipe">Recipe Request:</label><br>
                <textarea id="recipe" rows="5"></textarea><br><br>

                <input type="submit" value="Submit Request">

            </form>

            <p id="result"></p>

        </article>

    </main>

    <footer>
        <p>&copy; 2026 Recipes For U. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
